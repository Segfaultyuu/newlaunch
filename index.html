<script type="text/babel">
/* global React */
const { useState, useMemo, useEffect, useRef } = React;

// ---------- Icon (Lucide) ----------
const Icon = ({ name, size = 18, color = "currentColor", strokeWidth = 1.75, style = {} }) => (
  <i data-lucide={name} style={{ width: size, height: size, color, strokeWidth, display: "inline-flex", ...style }} />
);

// ---------- Button ----------
const Button = ({ intent = "primary", size = "md", icon, iconRight, children, onClick, style = {}, ...rest }) => {
  const bg = { primary: "var(--gray-100)", outlined: "var(--bg-default)", ghost: "transparent", brand: "var(--primary-40)", danger: "var(--error-50)" }[intent];
  const fg = { primary: "#fff", outlined: "var(--fg-default)", ghost: "var(--fg-default)", brand: "var(--primary-100)", danger: "#fff" }[intent];
  const border = intent === "outlined" ? "1px solid var(--border-default)" : "1px solid transparent";
  const pad = size === "sm" ? "7px 12px" : size === "lg" ? "13px 20px" : "10px 16px";
  const fs = size === "sm" ? 13 : size === "lg" ? 15 : 14;
  return (
    <button onClick={onClick} className="rx-btn" style={{
      display: "inline-flex", alignItems: "center", gap: 8,
      background: bg, color: fg, border, padding: pad, fontSize: fs, fontWeight: 600,
      borderRadius: 8, cursor: "pointer", letterSpacing: "-0.2px",
      fontFamily: "var(--font-sans)", transition: "background .15s ease, transform .05s",
      ...style,
    }} {...rest}>
      {icon && <Icon name={icon} size={fs + 2} />}
      {children}
      {iconRight && <Icon name={iconRight} size={fs + 2} />}
    </button>
  );
};

// ---------- Tag ----------
const Tag = ({ tone = "neutral", children, dot = true, style = {} }) => {
  const tones = {
    success: ["#E9FBEF", "#2B873F"],
    warning: ["#FFF1E5", "#C85D00"],
    info: ["#E5F1FF", "#005DCA"],
    danger: ["#FFEDED", "#C32B2B"],
    neutral: ["var(--gray-20)", "var(--gray-70)"],
    brand: ["#EAFFEE", "#2B873F"],
    dark: ["var(--gray-100)", "#fff"],
  };
  const [bg, fg] = tones[tone] || tones.neutral;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6, padding: "3px 10px",
      background: bg, color: fg, borderRadius: 9999, fontSize: 12, fontWeight: 600,
      letterSpacing: "-0.1px", whiteSpace: "nowrap", ...style,
    }}>
      {dot && <span style={{ width: 6, height: 6, borderRadius: 9999, background: fg }} />}
      {children}
    </span>
  );
};

// ---------- Card ----------
const Card = ({ children, style = {}, pad = 20, radius = 16, onClick }) => (
  <div onClick={onClick} style={{
    background: "var(--bg-default)",
    border: "1px solid var(--border-muted-card)",
    borderRadius: radius,
    padding: pad,
    boxShadow: "var(--shadow-xs)",
    cursor: onClick ? "pointer" : "default",
    transition: "border-color .15s ease, box-shadow .15s ease",
    ...style,
  }}>{children}</div>
);

// ---------- Bilingual label (EN primary, ZH secondary) ----------
const Bi = ({ en, zh, lang = "both", style = {} }) => {
  if (lang === "en" || !zh) return <span style={style}>{en}</span>;
  return (
    <span style={{ display: "inline-flex", flexDirection: "column", lineHeight: 1.15, ...style }}>
      <span>{en}</span>
      <span style={{ fontSize: "0.72em", color: "var(--fg-muted)", fontWeight: 400, letterSpacing: 0 }}>{zh}</span>
    </span>
  );
};

// ---------- Avatar ----------
const AV_COLORS = ["#3765F6", "#2B873F", "#F07000", "#929FB1", "#0A0D11"];
const Avatar = ({ name = "??", size = 36, online }) => {
  const initials = name.split(" ").map(n => n[0]).slice(0, 2).join("").toUpperCase();
  const hash = [...name].reduce((a, c) => a + c.charCodeAt(0), 0);
  const bg = AV_COLORS[hash % AV_COLORS.length];
  return (
    <div style={{
      width: size, height: size, borderRadius: 9999, background: bg, color: "#fff",
      display: "inline-flex", alignItems: "center", justifyContent: "center",
      fontWeight: 600, fontSize: size * 0.4, position: "relative", flexShrink: 0,
    }}>
      {initials}
      {online && <span style={{
        position: "absolute", right: 0, bottom: 0, width: size * 0.28, height: size * 0.28,
        background: "#4AC263", border: "2px solid var(--bg-default)", borderRadius: 9999,
      }} />}
    </div>
  );
};

// ---------- Sparkline ----------
const Sparkline = ({ data = [], color = "#2B873F", fill = "rgba(112,252,142,0.22)", height = 44, width = 200 }) => {
  if (!data.length) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const step = width / (data.length - 1);
  const pts = data.map((v, i) => `${i * step},${height - ((v - min) / range) * (height - 4) - 2}`);
  const path = `M${pts.join(" L")}`;
  const area = `${path} L${width},${height} L0,${height} Z`;
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ display: "block", width: "100%", height }}>
      <path d={area} fill={fill} />
      <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
};

// ---------- Placeholder image / "stub" tiles ----------
const Stub = ({ w = "100%", h = 120, label, tone = "neutral", style = {} }) => {
  const bg = tone === "dark" ? "var(--gray-100)" : "var(--gray-20)";
  const fg = tone === "dark" ? "var(--gray-50)" : "var(--gray-60)";
  return (
    <div style={{
      width: w, height: h, background: bg, borderRadius: 10,
      display: "flex", alignItems: "center", justifyContent: "center",
      color: fg, fontSize: 11, fontWeight: 600, letterSpacing: "0.08em",
      textTransform: "uppercase", fontFamily: "var(--font-mono)",
      backgroundImage: tone === "dark" ? "none" : "repeating-linear-gradient(135deg, rgba(0,0,0,0) 0 8px, rgba(0,0,0,0.025) 8px 16px)",
      ...style,
    }}>{label || "placeholder"}</div>
  );
};

// ---------- Slider ----------
const Slider = ({ value, onChange, min = 0, max = 100, step = 1, format = v => v, style = {} }) => (
  <div style={{ display: "flex", alignItems: "center", gap: 12, ...style }}>
    <input type="range" min={min} max={max} step={step} value={value}
      onChange={e => onChange(Number(e.target.value))}
      style={{ flex: 1, accentColor: "var(--primary-60)" }} />
    <span style={{
      minWidth: 72, textAlign: "right", fontFamily: "var(--font-mono)",
      fontSize: 13, fontWeight: 600, color: "var(--fg-default)",
    }}>{format(value)}</span>
  </div>
);

// ---------- Input ----------
const Input = ({ icon, style, ...rest }) => (
  <div style={{ position: "relative", ...style }}>
    {icon && <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "var(--fg-muted)" }}>
      <Icon name={icon} size={16} /></span>}
    <input {...rest} style={{
      width: "100%", boxSizing: "border-box",
      padding: icon ? "10px 14px 10px 36px" : "10px 14px",
      border: "1px solid var(--border-muted-input)", borderRadius: 8,
      fontSize: 14, fontFamily: "var(--font-sans)", background: "var(--bg-default)",
      color: "var(--fg-default)", outline: "none",
    }} />
  </div>
);

// ---------- Tabs ----------
const Tabs = ({ items, active, onChange }) => (
  <div style={{ display: "flex", gap: 2, borderBottom: "1px solid var(--border-muted)" }}>
    {items.map(it => {
      const is = it.id === active;
      return (
        <button key={it.id} onClick={() => onChange(it.id)} style={{
          padding: "12px 18px", border: 0, background: "transparent",
          fontFamily: "var(--font-sans)", fontSize: 14, fontWeight: is ? 700 : 500,
          color: is ? "var(--fg-default)" : "var(--fg-muted)", cursor: "pointer",
          borderBottom: is ? "2px solid var(--gray-100)" : "2px solid transparent",
          marginBottom: -1, letterSpacing: "-0.2px",
          display: "inline-flex", alignItems: "center", gap: 8,
        }}>
          {it.icon && <Icon name={it.icon} size={15} />}
          {it.label}
        </button>
      );
    })}
  </div>
);

// ---------- Metric ----------
const Metric = ({ label, sub, value, delta, deltaTone, mono = true, size = "md" }) => {
  const fs = size === "lg" ? 32 : size === "sm" ? 18 : 24;
  const deltaColor = deltaTone === "down" ? "#C32B2B" : deltaTone === "flat" ? "var(--fg-muted)" : "#2B873F";
  const deltaBg = deltaTone === "down" ? "#FFEDED" : deltaTone === "flat" ? "var(--gray-20)" : "#E9FBEF";
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: "var(--fg-muted)", letterSpacing: "0.04em", textTransform: "uppercase" }}>{label}</div>
      {sub && <div style={{ fontSize: 11, color: "var(--fg-muted)", marginTop: -2 }}>{sub}</div>}
      <div style={{ fontSize: fs, fontWeight: 700, color: "var(--fg-default)", letterSpacing: "-0.8px", lineHeight: 1.05, fontFamily: mono ? "var(--font-mono)" : "var(--font-display)", marginTop: 4 }}>
        {value}
      </div>
      {delta && (
        <div style={{
          display: "inline-flex", alignSelf: "flex-start", alignItems: "center", gap: 4,
          fontSize: 11, fontWeight: 600, color: deltaColor, background: deltaBg,
          padding: "2px 8px", borderRadius: 9999, marginTop: 4,
        }}>{delta}</div>
      )}
    </div>
  );
};

Object.assign(window, { Icon, Button, Tag, Card, Bi, Avatar, Sparkline, Stub, Slider, Input, Tabs, Metric });

</script>

<script type="text/babel">
/* global React, Card, Tag, Bi, Icon, Button, Stub, Metric, Sparkline, PROJECTS */
const { useMemo: useMemoDash, useState: useStateDash, useEffect: useEffectDash, useRef: useRefDash } = React;

// ---------- Hero prediction chart ----------
function PredictionChart({ project, height = 240 }) {
  const { useState: useStateChart, useRef: useRefChart, useCallback: useCallbackChart } = React;
  const W = 720, H = height;
  const padL = 58, padR = 48, padT = 32, padB = 44;
  const iw = W - padL - padR, ih = H - padT - padB;

  const base   = project.launchPsf || project.avgPsf || 2300;
  const low    = project.predictedUplift?.[0] ?? 5;
  const high   = project.predictedUplift?.[1] ?? 12;

  const stops = [
    { xf: 0.00, label: "Launch",     mid: base,                                                                   lo: base,                           hi: base },
    { xf: 0.18, label: "+1yr",       mid: base * 1.02,                                                            lo: base * 1.00,                    hi: base * 1.04 },
    { xf: 0.38, label: "Mid-build",  mid: base * 1.04,                                                            lo: base * 1.01,                    hi: base * 1.07 },
    { xf: 0.55, label: "TOP",        mid: base * (1 + (low + high) / 2 / 100 * 0.65),                            lo: base * (1 + low  / 100 * 0.55), hi: base * (1 + high / 100 * 0.75) },
    { xf: 0.78, label: "+3yr post",  mid: base * (1 + (low + high) / 2 / 100),                                   lo: base * (1 + low  / 100 * 0.85), hi: base * (1 + high / 100 * 1.05) },
    { xf: 1.00, label: "+5yr post",  mid: base * (1 + high / 100 * 1.1),                                         lo: base * (1 + low  / 100),        hi: base * (1 + high / 100 * 1.3)  },
  ];

  const yMin = base * 0.94;
  const yMax = base * (1 + Math.max(high, 20) / 100 * 1.35);
  const yv   = v  => padT + ih - ((v  - yMin) / (yMax - yMin)) * ih;
  const xv   = xf => padL + xf * iw;

  // Interpolate midline PSF at arbitrary x fraction
  const interpMid = xf => {
    for (let i = 0; i < stops.length - 1; i++) {
      if (xf >= stops[i].xf && xf <= stops[i + 1].xf) {
        const t = (xf - stops[i].xf) / (stops[i + 1].xf - stops[i].xf);
        return stops[i].mid + t * (stops[i + 1].mid - stops[i].mid);
      }
    }
    return stops[stops.length - 1].mid;
  };

  // TODAY state — launched projects start ~12% in, upcoming at ~2%
  const initFrac = project.status === "launched" ? 0.12 : 0.02;
  const [todayFrac, setTodayFrac] = useStateChart(initFrac);
  const [dragging,  setDragging]  = useStateChart(false);
  const svgRef = useRefChart(null);

  const fracFromEvent = useCallbackChart(e => {
    const svg  = svgRef.current;
    if (!svg) return null;
    const rect  = svg.getBoundingClientRect();
    const cx    = e.touches ? e.touches[0].clientX : e.clientX;
    const svgX  = ((cx - rect.left) / rect.width) * W;
    return Math.max(0, Math.min(0.95, (svgX - padL) / iw));
  }, []);

  const onPointerDown = e => { e.preventDefault(); setDragging(true); };
  const onPointerMove = useCallbackChart(e => {
    if (!dragging) return;
    const f = fracFromEvent(e);
    if (f !== null) setTodayFrac(f);
  }, [dragging, fracFromEvent]);
  const onPointerUp = () => setDragging(false);

  const mkPath = key => stops.map((s, i) =>
    `${i === 0 ? "M" : "L"}${xv(s.xf).toFixed(1)},${yv(s[key]).toFixed(1)}`).join(" ");
  const bandPath =
    `M${xv(stops[0].xf)},${yv(stops[0].hi)} ` +
    stops.slice(1).map(s => `L${xv(s.xf)},${yv(s.hi)}`).join(" ") + " " +
    stops.slice().reverse().map(s => `L${xv(s.xf)},${yv(s.lo)}`).join(" ") + " Z";

  const yTicks  = 4;
  const grid    = Array.from({ length: yTicks + 1 }, (_, i) => yMin + (yMax - yMin) * (i / yTicks));

  const vc = project.verdict === "outperform" ? "#2B873F"
           : project.verdict === "neutral"    ? "#C85D00"
           : project.verdict === "underperform" ? "#C32B2B" : "#2B873F";
  const bf = project.verdict === "outperform"   ? "rgba(112,252,142,0.18)"
           : project.verdict === "neutral"       ? "rgba(255,144,46,0.14)"
           : project.verdict === "underperform"  ? "rgba(255,82,82,0.14)"  : "rgba(112,252,142,0.18)";

  // TODAY derived values
  const todayPsf  = interpMid(todayFrac);
  const todayPct  = ((todayPsf / base - 1) * 100);
  const todayPctStr = (todayPct >= 0 ? "+" : "") + todayPct.toFixed(1) + "%";
  const txToday   = xv(todayFrac);
  const tyToday   = yv(todayPsf);

  // % badge helpers: avoid overlapping the TOP marker label
  const pctLabel = (s, i) => {
    const pct = ((s.mid / base - 1) * 100);
    if (i === 0) return null; // launch = 0%, skip
    const str = (pct >= 0 ? "+" : "") + pct.toFixed(0) + "%";
    return str;
  };

  return (
    <svg
      ref={svgRef}
      viewBox={`0 0 ${W} ${H}`}
      style={{ width: "100%", height: "auto", display: "block", userSelect: "none", touchAction: "none" }}
      onMouseMove={onPointerMove} onTouchMove={onPointerMove}
      onMouseUp={onPointerUp}    onTouchEnd={onPointerUp}
      onMouseLeave={onPointerUp}
    >
      {/* gridlines */}
      {grid.map((v, i) => (
        <g key={i}>
          <line x1={padL} x2={W - padR} y1={yv(v)} y2={yv(v)}
            stroke="var(--gray-20)" strokeDasharray={i === 0 || i === yTicks ? "0" : "3 4"} />
          <text x={padL - 6} y={yv(v) + 3} textAnchor="end"
            fontSize="10" fill="var(--fg-muted)" fontFamily="var(--font-mono)">
            ${Math.round(v).toLocaleString()}
          </text>
        </g>
      ))}

      {/* TOP vertical marker — label INSIDE chart above line */}
      <line x1={xv(0.55)} x2={xv(0.55)} y1={padT} y2={padT + ih}
        stroke={vc} strokeDasharray="2 3" strokeWidth="1.5" opacity="0.5" />
      <rect x={xv(0.55) + 4} y={padT + 4} width="30" height="16" rx="4" fill={vc} />
      <text x={xv(0.55) + 19} y={padT + 15} textAnchor="middle" fontSize="9" fill="#fff" fontWeight="700">TOP</text>

      {/* confidence band + lines */}
      <path d={bandPath} fill={bf} />
      <path d={mkPath("lo")} fill="none" stroke={vc} strokeWidth="1" strokeDasharray="2 3" opacity="0.5" />
      <path d={mkPath("hi")} fill="none" stroke={vc} strokeWidth="1" strokeDasharray="2 3" opacity="0.5" />
      <path d={mkPath("mid")} fill="none" stroke={vc} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />

      {/* Stop dots + x-axis labels + % badges */}
      {stops.map((s, i) => {
        const cx   = xv(s.xf);
        const cy   = yv(s.mid);
        const pct  = pctLabel(s, i);
        // nudge % badge left on last stop to stay inside
        const badgeX = i === stops.length - 1 ? cx - 28 : cx - 14;
        return (
          <g key={i}>
            {/* x-axis label */}
            <text x={cx} y={H - 6} textAnchor="middle" fontSize="10" fill="var(--fg-muted)" fontWeight="600">{s.label}</text>
            {/* dot */}
            <circle cx={cx} cy={cy} r={i === 3 ? 5 : 3} fill="var(--bg-default)" stroke={vc} strokeWidth="2" />
            {/* % badge above dot (skip launch=0%) */}
            {pct && (
              <g>
                <rect x={badgeX} y={cy - 22} width="28" height="16" rx="4" fill={vc} opacity="0.9" />
                <text x={badgeX + 14} y={cy - 10} textAnchor="middle" fontSize="9" fill="#fff" fontWeight="700" fontFamily="var(--font-mono)">{pct}</text>
              </g>
            )}
          </g>
        );
      })}

      {/* Draggable TODAY line */}
      <line x1={txToday} x2={txToday} y1={padT} y2={padT + ih}
        stroke="var(--gray-70)" strokeDasharray="4 4" strokeWidth="1.5" />

      {/* TODAY % badge — shown above drag handle */}
      {todayPct !== 0 && (() => {
        const bw = 42, bh = 18;
        const bx = Math.min(W - padR - bw - 2, Math.max(padL, txToday - bw / 2));
        return (
          <g>
            <rect x={bx} y={padT + ih - 36} width={bw} height={bh} rx="4" fill="var(--gray-100)" />
            <text x={bx + bw / 2} y={padT + ih - 23} textAnchor="middle" fontSize="10" fill="#fff" fontWeight="700" fontFamily="var(--font-mono)">{todayPctStr}</text>
          </g>
        );
      })()}

      {/* Drag handle (invisible wide hit area + visible diamond) */}
      <rect
        x={txToday - 12} y={padT + ih - 14} width="24" height="24"
        fill="transparent" rx="4"
        style={{ cursor: dragging ? "grabbing" : "ew-resize" }}
        onMouseDown={onPointerDown} onTouchStart={onPointerDown}
      />
      <polygon
        points={`${txToday},${padT + ih - 6} ${txToday + 7},${padT + ih + 2} ${txToday},${padT + ih + 10} ${txToday - 7},${padT + ih + 2}`}
        fill="var(--gray-100)" stroke="#fff" strokeWidth="1.5"
        style={{ cursor: dragging ? "grabbing" : "ew-resize" }}
        onMouseDown={onPointerDown} onTouchStart={onPointerDown}
      />

      {/* TODAY dot on midline */}
      <circle cx={txToday} cy={tyToday} r="5" fill="#fff" stroke="var(--gray-80)" strokeWidth="2" />
    </svg>
  );
}

// ---------- Dashboard ----------
function Dashboard({ lang, persona, onNav, onOpenProject, isMobile = false }) {
  const [ppi, setPpi] = useStateDash(null);
  const [headlineForecast, setHeadlineForecast] = useStateDash(null);

  useEffectDash(() => {
    window.LIVE_DATA?.fetchPPI().then(setPpi).catch(() => {});
  }, []);

  const headlineBase = PROJECTS[0];
  useEffectDash(() => {
    window.LIVE_DATA?.forecastProject(headlineBase).then(setHeadlineForecast).catch(() => {});
  }, [headlineBase.id]);

  const personaCopy = {
    investor: { en: "Capital efficiency & exit windows — focus on PSF vs. resale and yield.", zh: "关注资金效率、尺价差与租金回报。" },
    upgrader: { en: "Cashflow, schools, and family layouts — 3BR leads.", zh: "关注现金流、学区与三房户型。" },
    firsttime: { en: "We'll walk you through jargon. Start with the glossary.", zh: "为您解释专业术语，建议先看词汇表。" },
  }[persona];

  // ── Derive KPIs from real PROJECTS data ─────────────────────────────────
  const launched  = PROJECTS.filter(p => p.status === "launched");
  const upcoming  = PROJECTS.filter(p => p.status === "upcoming");
  const withDay1  = launched.filter(p => p.day1Sold != null);
  const avgDay1   = withDay1.length
    ? Math.round(withDay1.reduce((s, p) => s + p.day1Sold, 0) / withDay1.length)
    : null;
  // YoY approximation: compare first-half vs second-half of launched list
  const half = Math.floor(withDay1.length / 2);
  const oldAvg = half > 0 ? withDay1.slice(0, half).reduce((s,p)=>s+p.day1Sold,0)/half : null;
  const newAvg = half > 0 ? withDay1.slice(half).reduce((s,p)=>s+p.day1Sold,0)/(withDay1.length-half) : null;
  const day1YoY = (oldAvg && newAvg) ? Math.round(newAvg - oldAvg) : null;

  const upcomingUnits = upcoming.reduce((s, p) => s + (p.units || 0), 0);

  // ── Regional heat from real project data ──────────────────────────────
  const REGION_META = [
    { key: "OCR East",  label: "OCR East",  en: "Tampines, Bedok, Bayshore" },
    { key: "OCR West",  label: "OCR West",  en: "Clementi, Jurong, Buona Vista" },
    { key: "OCR North", label: "OCR North", en: "Lentor, Yishun, Woodlands" },
    { key: "RCR",       label: "RCR",       en: "Queenstown, Toa Payoh, Kallang" },
    { key: "CCR",       label: "CCR",       en: "Orchard, Holland, River Valley" },
  ];
  const regionalHeat = useMemoDash(() => REGION_META.map(r => {
    const inRegion = PROJECTS.filter(p => p.region === r.key);
    const outperform = inRegion.filter(p => p.verdict === "outperform");
    const pct = inRegion.length ? Math.round(outperform.length / inRegion.length * 100) : 0;
    return { ...r, n: outperform.length, total: inRegion.length, pct };
  }), []);
  const maxPct = Math.max(...regionalHeat.map(r => r.pct), 1);

  // ── Merge live forecast into headline project ─────────────────────────
  const headline = headlineForecast ? {
    ...headlineBase,
    predictedUplift: [headlineForecast.upliftLow, headlineForecast.upliftHigh],
    fairPsf: [headlineForecast.fairLow, headlineForecast.fairHigh],
    rentalYield: headlineForecast.yieldAtTop,
    _forecast: headlineForecast,
  } : headlineBase;

  // Est. IRR: (mid-uplift + rentalYield × 3) / 3
  const upliftMid = headlineForecast?.upliftMid ?? Math.round((headline.predictedUplift[0]+headline.predictedUplift[1])/2);
  const irrEst = ((upliftMid / 100 + (headline.rentalYield || 3.8) * 3 / 100) / 3 * 100).toFixed(1);

  const watching = PROJECTS.filter(p => ["parktown-residence", "pinery-residences", "bedok-rise"].includes(p.id));

  return (
    <div style={{ padding: isMobile ? 12 : 24, display: "flex", flexDirection: "column", gap: isMobile ? 12 : 16 }}>
      {/* KPI strip */}
      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4, 1fr)", gap: isMobile ? 10 : 16 }}>
        <Card pad={18} radius={16}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}>
            <Metric
              label={ppi ? "Private Residential PPI" : "OCR East Avg PSF"}
              sub={ppi
                ? `${ppi.quarter} · Non-Landed`
                : (lang === "both" ? "东部中部外 尺价" : "Mass market, last 30d")}
              value={ppi ? String(ppi.index.toFixed(1)) : "$2,284"}
              delta={ppi
                ? `${ppi.qoqPct >= 0 ? "▲" : "▼"} ${Math.abs(ppi.qoqPct)}% QoQ`
                : "▲ 4.2% QoQ"}
              deltaTone={ppi ? (ppi.qoqPct >= 0 ? "up" : "down") : "up"}
            />
            {ppi && ppi.history && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                <span style={{
                  fontSize: 9, fontWeight: 700, letterSpacing: "0.08em",
                  background: "#E9FBEF", color: "#2B873F",
                  padding: "2px 6px", borderRadius: 9999,
                }}>LIVE</span>
                <Sparkline data={ppi.history.map(h => h.index)} width={80} height={28} />
              </div>
            )}
          </div>
        </Card>
        <Card pad={18} radius={16}>
          <Metric label="Tracked Launches" sub={lang === "both" ? "新盘跟踪数量" : "Live in platform"}
            value={`${launched.length} / ${upcoming.length}`}
            delta="launched / upcoming" deltaTone="flat" />
        </Card>
        <Card pad={18} radius={16}>
          <Metric label="Avg Day-1 Sell-through"
            sub={lang === "both" ? "首日平均去化" : `${withDay1.length} tracked launches`}
            value={avgDay1 != null ? `${avgDay1}%` : "—"}
            delta={day1YoY != null ? `${day1YoY >= 0 ? "▲" : "▼"} ${Math.abs(day1YoY)}pt recent vs earlier` : "across tracked launches"}
            deltaTone={day1YoY != null ? (day1YoY >= 0 ? "up" : "down") : "flat"} />
        </Card>
        <Card pad={18} radius={16}>
          <Metric label="Upcoming supply"
            sub={lang === "both" ? "待售单位" : `${upcoming.length} tracked upcoming launches`}
            value={upcomingUnits.toLocaleString()}
            delta="units in pipeline" deltaTone="flat" />
        </Card>
      </div>

      {/* Headline forecast — Vela Bay */}
      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "2fr 1fr", gap: 16 }}>
        <Card pad={22} radius={16}>
          <div style={{ display: "flex", alignItems: "flex-start", marginBottom: 16 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", color: "var(--fg-muted)", textTransform: "uppercase" }}>
                Headline forecast · 重点预测
              </div>
              <div style={{ fontSize: 22, fontWeight: 700, color: "var(--fg-default)", letterSpacing: "-0.5px", marginTop: 4, lineHeight: 1.2 }}>
                {headline.name} {lang === "both" && <span style={{ fontSize: 15, color: "var(--fg-muted)", fontWeight: 500 }}> · {headline.zhName}</span>}
              </div>
              <div style={{ fontSize: 12, color: "var(--fg-muted)", marginTop: 2 }}>
                {headline.district} · TOP {headline.topDate}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Tag tone="success">{headline.verdictLabel} · {headline.zhVerdictLabel}</Tag>
              <Button intent="outlined" size="sm" iconRight="arrow-right" onClick={() => onOpenProject(headline.id)}>Open detail</Button>
            </div>
          </div>

          <PredictionChart project={headline} />

          <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4, 1fr)", gap: 14, marginTop: 18, paddingTop: 16, borderTop: "1px solid var(--border-muted)" }}>
            <Metric label="TOP uplift (mid)" value={`+${Math.round((headline.predictedUplift[0]+headline.predictedUplift[1])/2)}%`} delta={`range ${headline.predictedUplift[0]}–${headline.predictedUplift[1]}%`} deltaTone="up" />
            <Metric label="Fair PSF range" value={`$${headline.fairPsf[0].toLocaleString()}–$${headline.fairPsf[1].toLocaleString()}`} mono={false} />
            <Metric label="Rental yield" value={`${headline.rentalYield}%`} delta={`${headline.region} benchmark`} deltaTone="up" />
            <Metric label="Day-1 sold" value={`${headline.day1Sold}%`} delta={`${headline.units.toLocaleString()} units total`} deltaTone="up" />
          </div>
        </Card>

        <Card pad={22} radius={16} style={{ background: "var(--gray-100)", borderColor: "transparent", color: "#fff", display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: "#70FC8E" }}>
            <Icon name="sparkles" size={14} />
            <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>Forecaster AI</span>
          </div>
          <div style={{ fontSize: 18, fontWeight: 700, letterSpacing: "-0.3px", lineHeight: 1.3, color: "#fff" }}>
            Why this matters for you
          </div>
          <div style={{ fontSize: 16, color: "var(--gray-30)", lineHeight: 1.55 }}>
            {persona === "investor" && `${headline.name} sold ${headline.day1Sold}% on day 1 at $${headline.launchPsf.toLocaleString()} PSF — integrated Tampines North CRL station (2030) plus thin Tampines new-launch pipeline supports the ${headline.predictedUplift[0]}–${headline.predictedUplift[1]}% TOP uplift range.`}
            {persona === "upgrader" && `${headline.name} 3BR at ~$${(headline.unitMix.find(u=>u.type==="3BR")?.psf||headline.launchPsf).toLocaleString()} PSF with on-site hawker, retail and bus interchange — Poi Ching School within 1km, CRL at your doorstep from 2030.`}
            {persona === "firsttime" && "Fair PSF means what a project should cost, based on land cost + build + normal developer margin. When launch PSF is close to the low end, you're getting a deal."}
          </div>
          <div style={{ marginTop: "auto", padding: "14px 16px", background: "var(--gray-95)", borderRadius: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 14, color: "var(--gray-40)", fontWeight: 500 }}>Est. 3-yr IRR{headlineForecast ? "" : " (static)"}</span>
            <span style={{ fontSize: 28, color: "#70FC8E", fontWeight: 700, fontFamily: "var(--font-mono)", letterSpacing: "-0.5px" }}>{irrEst}%</span>
          </div>
          <Button intent="brand" size="sm" style={{ justifyContent: "center" }} onClick={() => onOpenProject(headline.id)}>
            See full analysis
          </Button>
        </Card>
      </div>

      {/* Watchlist + Heat map */}
      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "2fr 1fr", gap: 16 }}>
        <Card pad={22} radius={16}>
          <div style={{ display: "flex", alignItems: "center", marginBottom: 14 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 16, fontWeight: 700, letterSpacing: "-0.3px" }}>Your watchlist · 关注列表</div>
              <div style={{ fontSize: 12, color: "var(--fg-muted)", marginTop: 2 }}>3 tracked · price signals updated daily</div>
            </div>
            <Button intent="ghost" size="sm" iconRight="arrow-right" onClick={() => onNav("launched")}>See all</Button>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {watching.map(p => (
              <div key={p.id} onClick={() => onOpenProject(p.id)} style={{
                display: "grid", gridTemplateColumns: isMobile ? "1fr 90px 80px" : "44px 1fr 90px 120px 90px 30px", alignItems: "center", gap: isMobile ? 8 : 14,
                padding: "10px 12px", borderRadius: 10, border: "1px solid var(--border-muted)",
                cursor: "pointer", background: "var(--bg-default)",
              }}>
                <Stub w={44} h={44} label="IMG" style={{ borderRadius: 8 }} />
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "var(--fg-default)", letterSpacing: "-0.2px" }}>
                    {p.name} {lang === "both" && <span style={{ color: "var(--fg-muted)", fontWeight: 500 }}> · {p.zhName}</span>}
                  </div>
                  <div style={{ fontSize: 11, color: "var(--fg-muted)" }}>{p.district} · {p.developer}</div>
                </div>
                <div style={{ fontSize: 12 }}>
                  <div style={{ color: "var(--fg-muted)", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 600 }}>PSF</div>
                  <div style={{ fontFamily: "var(--font-mono)", fontWeight: 600 }}>${p.avgPsf || p.fairPsf[0]}</div>
                </div>
                <div>
                  <div style={{ color: "var(--fg-muted)", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 600 }}>Forecast</div>
                  <div style={{ fontFamily: "var(--font-mono)", fontWeight: 600, color: p.verdict === "outperform" ? "#2B873F" : p.verdict === "neutral" ? "#C85D00" : "var(--fg-default)" }}>
                    {p.predictedUplift ? `+${p.predictedUplift[0]}–${p.predictedUplift[1]}%` : `Score ${p.entryScore}`}
                  </div>
                </div>
                <Tag tone={p.verdict === "outperform" ? "success" : p.verdict === "neutral" ? "warning" : "info"} dot>
                  {p.verdictLabel}
                </Tag>
                <Icon name="chevron-right" size={16} color="var(--fg-muted)" />
              </div>
            ))}
          </div>
        </Card>

<script type="text/babel">
/* global React, Card, Tag, Icon, Button, Stub, Input, PROJECTS */
const { useState: useStateList, useMemo: useMemoList } = React;

function ProjectsList({ lang, mode, onOpenProject, isMobile = false }) {
  const [sort, setSort] = useStateList(mode === "launched" ? "forecast" : "score");
  const [filterRegion, setFilterRegion] = useStateList("all");
  const [filterTenure, setFilterTenure] = useStateList("all");
  const [q, setQ] = useStateList("");

  const list = useMemoList(() => {
    let arr = PROJECTS.filter(p => p.status === mode);
    if (filterRegion !== "all") arr = arr.filter(p => p.region === filterRegion);
    if (filterTenure !== "all") arr = arr.filter(p => p.tenure.toLowerCase().includes(filterTenure));
    if (q) arr = arr.filter(p => (p.name + p.zhName + p.district).toLowerCase().includes(q.toLowerCase()));
    arr = arr.slice().sort((a, b) => {
      if (sort === "forecast") return (b.predictedUplift?.[1] || 0) - (a.predictedUplift?.[1] || 0);
      if (sort === "score") return (b.entryScore || 0) - (a.entryScore || 0);
      if (sort === "psf-low") return (a.avgPsf || a.fairPsf?.[0] || 0) - (b.avgPsf || b.fairPsf?.[0] || 0);
      if (sort === "psf-high") return (b.avgPsf || b.fairPsf?.[1] || 0) - (a.avgPsf || a.fairPsf?.[1] || 0);
      if (sort === "top-date") return a.topDate.localeCompare(b.topDate);
      return 0;
    });
    return arr;
  }, [mode, sort, filterRegion, filterTenure, q]);

  return (
    <div style={{ padding: isMobile ? 12 : 24, display: "flex", flexDirection: "column", gap: isMobile ? 10 : 16 }}>
      {/* Filter bar */}

            <Select label="Region · 区域" value={filterRegion} onChange={setFilterRegion} options={[

              { v: "OCR West", l: "OCR West" }, { v: "OCR North", l: "OCR North" },
              { v: "OCR North-East", l: "OCR NE" }, { v: "RCR", l: "RCR" }, { v: "CCR", l: "CCR" },
            ]} />
            <Select label="Tenure · 地契" value={filterTenure} onChange={setFilterTenure} options={[
              { v: "all", l: "All" }, { v: "99", l: "99-yr" }, { v: "freehold", l: "Freehold" },
            ]} />
            <div style={{ flex: 1 }} />
            <Select label="Sort · 排序" value={sort} onChange={setSort} options={mode === "launched" ? [
              { v: "forecast", l: "Forecast uplift" },
              { v: "psf-low", l: "PSF ↑" },
              { v: "psf-high", l: "PSF ↓" },
              { v: "top-date", l: "TOP date" },
            ] : [
              { v: "score", l: "Entry score" },
              { v: "psf-low", l: "Fair PSF ↑" },
              { v: "top-date", l: "TOP date" },

<script type="text/babel">
/* global React, Card, Tag, Icon, Button, Stub, Tabs, Metric, Sparkline, PredictionChart, PROJECTS_BY_ID */
const { useState: useStateD, useEffect: useEffectD } = React;

function ProjectDetail({ projectId, lang, persona, onBack, isMobile = false }) {
  const pBase = PROJECTS_BY_ID[projectId] || PROJECTS_BY_ID["parktown-residence"];
  const [tab, setTab] = useStateD("prediction");
  const [forecast, setForecast] = useStateD(null);
  useEffectD(() => {
    setForecast(null);
    window.LIVE_DATA?.forecastProject(pBase).then(setForecast).catch(() => {});
  }, [pBase.id]);

  // Merge live forecast into project so children (PredictionChart, Metric etc.) use it.
  // Also fill defaults for upcoming projects (no launchPsf/day1Sold/etc.) so the
  // detail layout renders without crashing.
  const fairMid = pBase.fairPsf ? Math.round((pBase.fairPsf[0] + pBase.fairPsf[1]) / 2) : 2300;
  const defaults = {
    launchPsf: pBase.launchPsf || fairMid,
    avgPsf: pBase.avgPsf || pBase.launchPsf || fairMid,
    day1Sold: pBase.day1Sold ?? null,
    totalSold: pBase.totalSold ?? null,
    predictedUplift: pBase.predictedUplift || [5, 12],
    rentalYield: pBase.rentalYield || 3.6,
    vacancyRisk: pBase.vacancyRisk || "low",
    premiumIndex: pBase.premiumIndex ?? 10,
    competingSupply: pBase.competingSupply || null,
    unitMix: pBase.unitMix || [],
    highlights: pBase.highlights || [],
    schools: pBase.schools || [],
    tenantProfile: pBase.tenantProfile || "—",
    mrtDistance: pBase.mrtDistance || "—",
  };
  const p = {
    ...pBase,
    ...Object.fromEntries(Object.entries(defaults).filter(([k]) => pBase[k] == null)),
    ...(forecast ? {
      predictedUplift: [forecast.upliftLow, forecast.upliftHigh],
      fairPsf: [forecast.fairLow, forecast.fairHigh],
      rentalYield: forecast.yieldAtTop,
    } : {}),
    _forecast: forecast,
    _upcoming: pBase.status === "upcoming",
  };

  const verdictTone = p.verdict === "outperform" ? "success" : p.verdict === "neutral" ? "warning" : "info";

  return (
    <div style={{ padding: isMobile ? 12 : 24, display: "flex", flexDirection: "column", gap: isMobile ? 12 : 16 }}>
      {/* Back + hero header */}

        <Button intent="outlined" size="sm" icon="arrow-left" onClick={onBack}>Back</Button>
        <span style={{ fontSize: 12, color: "var(--fg-muted)" }}>
          <span style={{ cursor: "pointer" }} onClick={onBack}>Launched Projects</span> <Icon name="chevron-right" size={11} /> <span style={{ color: "var(--fg-default)", fontWeight: 600 }}>{p.name}</span>
        </span>
      </div>

      <Card pad={0} radius={16} style={{ overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "320px 1fr", gap: 0 }}>
          <Stub h={220} label="HERO · PROJECT RENDER" style={{ borderRadius: 0 }} />
          <div style={{ padding: "22px 26px", display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              <Tag tone={verdictTone}>{p.verdictLabel} · {p.zhVerdictLabel}</Tag>
              <Tag tone="neutral" dot={false}>{p.tenure}</Tag>
              <Tag tone="neutral" dot={false}>{p.units} units</Tag>
              <Tag tone="neutral" dot={false}>TOP {p.topDate}</Tag>
            </div>
            <div>
              <div style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.6px", color: "var(--fg-default)", lineHeight: 1.15 }}>

            <div style={{ gridColumn: "span 4", fontSize: 13, color: "var(--fg-muted)", padding: 14 }}>

              <tr key={i} style={{ borderTop: "1px solid var(--border-muted)" }}>
                <td style={{ padding: "10px 0", fontWeight: 600 }}>{t.name}</td>
                <td style={{ padding: "10px 0", color: "var(--fg-muted)", fontFamily: "var(--font-mono)" }}>{t.year}</td>
                <td style={{ padding: "10px 0", textAlign: "right", fontFamily: "var(--font-mono)", fontWeight: 600, color: "#2B873F" }}>{t.uplift}</td>
                <td style={{ padding: "10px 0", textAlign: "right", fontFamily: "var(--font-mono)" }}>{t.quality} ★</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      <Card pad={22} radius={16}>
        <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: "-0.2px" }}>Reputation signals</div>
        <div style={{ fontSize: 12, color: "var(--fg-muted)", marginTop: 2, marginBottom: 14 }}>Aggregated from buyer reviews & handover defects</div>
        {[
          { label: "Build quality · 工程质量", v: 82 },
          { label: "Material spec · 用料", v: 76 },
          { label: "Handover defects · 交付瑕疵", v: 68, inv: true },
          { label: "Post-TOP MCST · 管理", v: 71 },
        ].map((r, i) => (
          <div key={i} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", fontSize: 12, marginBottom: 4 }}>
              <span style={{ flex: 1, fontWeight: 600 }}>{r.label}</span>
              <span style={{ fontFamily: "var(--font-mono)", color: "var(--fg-muted)" }}>{r.v}/100</span>
            </div>
            <div style={{ height: 6, background: "var(--gray-20)", borderRadius: 9999, overflow: "hidden" }}>
              <div style={{ width: `${r.v}%`, height: "100%", background: r.v > 75 ? "#70FC8E" : r.v > 60 ? "#3765F6" : "#FF902E" }} />

<script type="text/babel">
/* global React, Card, Icon, Button, Slider, Tag, Metric */
const { useState: useStateC, useMemo: useMemoC } = React;

const STAGE_GROUPS = [
  { label: "Early Payments", zh: "前期付款", color: "#3765F6", bg: "rgba(55,101,246,0.08)", indices: [0, 1] },
  { label: "Construction Milestones", zh: "建设阶段", color: "#C85D00", bg: "rgba(200,93,0,0.08)", indices: [2, 3, 4, 5, 6, 7] },
  { label: "TOP", zh: "交房", color: "#2B873F", bg: "rgba(43,135,63,0.08)", indices: [8] },
  { label: "CSC", zh: "入伙", color: "var(--gray-60)", bg: "var(--gray-10)", indices: [9] },
];

function CurrencyInput({ value, onChange, placeholder }) {
  const [raw, setRaw] = useStateC(value ? Number(value).toLocaleString() : "");
  const [focused, setFocused] = useStateC(false);

  const handleChange = e => {
    const digits = e.target.value.replace(/[^0-9]/g, "");
    setRaw(digits);
    onChange(parseFloat(digits) || 0);
  };
  const handleFocus = e => {
    setFocused(true);
    const digits = e.target.value.replace(/[^0-9,]/g, "").replace(/,/g, "");
    setRaw(digits);
    e.target.select();
  };
  const handleBlur = e => {
    setFocused(false);
    const n = parseFloat(raw.replace(/,/g, "")) || 0;
    setRaw(n > 0 ? n.toLocaleString() : "");
  };

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style={{ fontSize: 13, color: "var(--fg-muted)", fontWeight: 600, flexShrink: 0 }}>$</span>
      <input
        type="text"
        inputMode="numeric"
        value={raw}
        onChange={handleChange}
        onFocus={handleFocus}
        onBlur={handleBlur}
        placeholder={placeholder}
        style={{
          flex: 1, padding: "9px 12px", border: "1px solid var(--border-muted-input)",
          borderRadius: 8, fontSize: 14, fontFamily: "var(--font-mono)",
          fontWeight: 600, background: "var(--bg-muted)", color: "var(--fg-default)",
          outline: "none", width: "100%", boxSizing: "border-box",
        }}
      />
    </div>
  );
}

const SORA_SPREAD = 0.2; // bank spread fixed at +0.2%

function Calculator({ lang, isMobile = false }) {
  const [price, setPrice] = useStateC(2400000);
  const [cpf, setCpf] = useStateC(0);
  const [loanPct, setLoanPct] = useStateC(75);
  const [soraType, setSoraType] = useStateC("1m");   // "1m" | "3m"
  const [soraInput, setSoraInput] = useStateC("1.30"); // current SORA rate %
  const [tenure, setTenure] = useStateC(30);
  const [buildMonths, setBuildMonths] = useStateC(42);

  const soraRate = Math.max(0, parseFloat(soraInput) || 0);
  const rate = soraRate + SORA_SPREAD; // effective rate = SORA + spread

  const loan = price * (loanPct / 100);
  const down = price - loan;
  const monthly = (loan * (rate / 100 / 12)) / (1 - Math.pow(1 + rate / 100 / 12, -tenure * 12));

  const pps = [
    { pct: 5,  name: "Booking fee",         zh: "订金",       at: 0 },
    { pct: 15, name: "Sale & Purchase",      zh: "S&P",        at: 2 },
    { pct: 10, name: "Foundation",           zh: "地基",       at: Math.round(buildMonths * 0.2) },
    { pct: 10, name: "Reinforced concrete",  zh: "钢筋混凝土", at: Math.round(buildMonths * 0.35) },
    { pct: 5,  name: "Brick walls",          zh: "砖墙",       at: Math.round(buildMonths * 0.5) },
    { pct: 5,  name: "Roofing",              zh: "封顶",       at: Math.round(buildMonths * 0.6) },
    { pct: 5,  name: "Finishes",             zh: "装修",       at: Math.round(buildMonths * 0.72) },
    { pct: 5,  name: "Car park & drainage",  zh: "车库排水",   at: Math.round(buildMonths * 0.82) },
    { pct: 25, name: "TOP",                  zh: "交房",       at: buildMonths },
    { pct: 15, name: "CSC",                  zh: "入伙",       at: buildMonths + 12 },
  ];

  // CPF: booking fee (5%) must always be cash; remaining downpayment can use CPF
  let cpfRemaining = cpf;
  let cumLoan = 0;
  const rows = pps.map((s, i) => {
    const amount = price * (s.pct / 100);
    const downRemaining = Math.max(0, down - price * pps.slice(0, i).reduce((a, b) => a + b.pct, 0) / 100);
    const downUsed = Math.min(amount, downRemaining);
    const loanDrawn = amount - downUsed;
    cumLoan += loanDrawn;
    const interestOnly = (cumLoan * rate / 100) / 12;
    const cpfUsed = i === 0 ? 0 : Math.min(cpfRemaining, downUsed);
    cpfRemaining -= cpfUsed;
    const cashDown = downUsed - cpfUsed;
    return { ...s, amount, downUsed, loanDrawn, cumLoan, interestOnly, cpfUsed, cashDown };
  });

  // Total to TOP breakdown
  const topRows = rows.filter(r => r.at <= buildMonths);
  const totalCashDown = topRows.reduce((s, r) => s + r.cashDown, 0);
  const totalCpfUsed = topRows.reduce((s, r) => s + r.cpfUsed, 0);
  const estInterestBuild = topRows.reduce((s, r) => s + r.interestOnly, 0) / topRows.length * buildMonths;
  const cashToTOP = totalCashDown + estInterestBuild;
  const cpfToTOP = totalCpfUsed;
  const totalToTOP = cashToTOP + cpfToTOP;

  const pad = isMobile ? 12 : 24;

  return (
    <div style={{ padding: pad, display: "flex", flexDirection: "column", gap: isMobile ? 12 : 16 }}>
      {/* Header */}
      <Card pad={0} radius={16} style={{ background: "var(--gray-100)", color: "#fff", overflow: "hidden" }}>
        <div style={{ padding: isMobile ? "16px 18px" : "22px 26px", display: "flex", alignItems: "center", gap: 12 }}>
          <Icon name="calculator" size={20} color="#70FC8E" />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: isMobile ? 15 : 18, fontWeight: 700, letterSpacing: "-0.3px" }}>Progressive Payment Simulator</div>
            <div style={{ fontSize: 11, color: "var(--gray-40)", marginTop: 2 }}>期房阶段性付款计算器 · Model your cash-flow from booking to CSC</div>
          </div>
          <Tag tone="brand">Live · 实时</Tag>
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1.5fr", gap: isMobile ? 12 : 16 }}>
        {/* Inputs */}
        <Card pad={isMobile ? 16 : 22} radius={16}>
          <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: "-0.2px", marginBottom: 14 }}>Inputs · 参数</div>

          <Field label="Purchase price · 购房总价">
            <CurrencyInput value={price} onChange={setPrice} placeholder="e.g. 2400000" />
          </Field>
          <Field label="CPF available · 公积金可用额">
            <CurrencyInput value={cpf} onChange={setCpf} placeholder="0 if not applicable" />
          </Field>
          <Field label="Loan-to-value · 贷款成数">
            <Slider value={loanPct} onChange={setLoanPct} min={25} max={75} step={5} format={v => `${v}%`} />
          </Field>
          <Field label="Interest rate · 贷款利率 (SORA + 0.2%)">
            {/* SORA type toggle */}
            <div style={{ display: "inline-flex", padding: 3, borderRadius: 8, gap: 2, border: "1px solid var(--border-muted)", background: "var(--bg-muted)", marginBottom: 8 }}>
              {["1m", "3m"].map(t => {
                const active = soraType === t;
                return (
                  <button key={t} onClick={() => setSoraType(t)} style={{
                    padding: "5px 12px", border: 0, borderRadius: 6,
                    background: active ? "var(--gray-100)" : "transparent",
                    color: active ? "#fff" : "var(--fg-muted)",
                    fontSize: 12, fontWeight: 700, cursor: "pointer",
                    fontFamily: "var(--font-sans)", letterSpacing: "0.02em",
                  }}>
                    {t === "1m" ? "1M SORA" : "3M SORA"}
                  </button>
                );
              })}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", border: "1px solid var(--border-muted-input)", borderRadius: 8, background: "var(--bg-muted)" }}>
                <span style={{ fontSize: 11, color: "var(--fg-muted)", fontWeight: 600, flexShrink: 0 }}>{soraType === "1m" ? "1M" : "3M"} SORA</span>
                <input
                  type="text"
                  inputMode="decimal"
                  value={soraInput}
                  onChange={e => setSoraInput(e.target.value.replace(/[^0-9.]/g, ""))}
                  style={{
                    width: 48, border: 0, background: "transparent", fontSize: 14,
                    fontFamily: "var(--font-mono)", fontWeight: 700, color: "var(--fg-default)",
                    outline: "none", textAlign: "right",
                  }}
                />
                <span style={{ fontSize: 13, color: "var(--fg-muted)", fontWeight: 600 }}>%</span>
                <span style={{ fontSize: 11, color: "var(--fg-muted)", marginLeft: 2 }}>+ 0.2% spread</span>
              </div>
              <div style={{ padding: "8px 12px", background: "var(--gray-100)", borderRadius: 8, flexShrink: 0, textAlign: "center" }}>
                <div style={{ fontSize: 9, color: "var(--gray-40)", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em" }}>Effective</div>
                <div style={{ fontSize: 15, fontWeight: 700, fontFamily: "var(--font-mono)", color: "#70FC8E" }}>{rate.toFixed(2)}%</div>
              </div>
            </div>
            <div style={{ fontSize: 10, color: "var(--fg-muted)", marginTop: 6 }}>
              SORA fluctuates daily — Mar 2025 was ~1.30%. All interest figures are estimates.
            </div>
          </Field>
          <Field label="Loan tenure · 贷款年限">
            <Slider value={tenure} onChange={setTenure} min={10} max={35} step={1} format={v => `${v} yrs`} />
          </Field>
          <Field label="Build duration · 建设周期">
            <Slider value={buildMonths} onChange={setBuildMonths} min={30} max={60} step={3} format={v => `${v} mo`} />
          </Field>

          <div style={{ marginTop: 16, padding: isMobile ? 12 : 14, background: "var(--gray-10)", borderRadius: 10, display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10 }}>
            <Metric label="Downpayment" value={`$${Math.round(down).toLocaleString()}`} mono />
            <Metric label="Loan amount" value={`$${Math.round(loan).toLocaleString()}`} mono />
            <Metric label="Monthly (post-TOP)" value={`$${Math.round(monthly).toLocaleString()}`} mono />
            <Metric label="Total interest" value={`$${Math.round(monthly*tenure*12-loan).toLocaleString()}`} mono />
          </div>

          {/* Total paid by TOP — with CPF breakdown */}
          <div style={{ marginTop: 10, padding: isMobile ? 12 : 14, background: "var(--gray-100)", borderRadius: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
              <div>
                <div style={{ fontSize: 11, fontWeight: 700, color: "var(--gray-40)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Est. total paid by TOP · 预计交房前总支出</div>
                <div style={{ fontSize: 11, color: "var(--gray-50)", marginTop: 2 }}>Cash + CPF + est. interest @ {soraType === "1m" ? "1M" : "3M"} SORA {soraRate.toFixed(2)}% + 0.2%</div>
              </div>
              <div style={{ fontSize: 22, fontWeight: 700, fontFamily: "var(--font-mono)", color: "#70FC8E", letterSpacing: "-0.5px", flexShrink: 0, marginLeft: 12 }}>
                ${Math.round(totalToTOP).toLocaleString()}
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, paddingTop: 10, borderTop: "1px solid var(--gray-90)" }}>
              <div style={{ padding: "8px 10px", background: "var(--gray-95)", borderRadius: 8 }}>
                <div style={{ fontSize: 9, fontWeight: 700, color: "var(--gray-50)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Cash out-of-pocket</div>
                <div style={{ fontSize: 15, fontWeight: 700, fontFamily: "var(--font-mono)", color: "#fff" }}>${Math.round(cashToTOP).toLocaleString()}</div>
                <div style={{ fontSize: 10, color: "var(--gray-50)", marginTop: 2 }}>incl. interest during build</div>
              </div>
              <div style={{ padding: "8px 10px", background: "var(--gray-95)", borderRadius: 8 }}>
                <div style={{ fontSize: 9, fontWeight: 700, color: "var(--gray-50)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>CPF used · 公积金</div>
                <div style={{ fontSize: 15, fontWeight: 700, fontFamily: "var(--font-mono)", color: cpfToTOP > 0 ? "#70FC8E" : "var(--gray-60)" }}>${Math.round(cpfToTOP).toLocaleString()}</div>
                <div style={{ fontSize: 10, color: "var(--gray-50)", marginTop: 2 }}>excl. 5% booking (cash only)</div>
              </div>
            </div>
          </div>
        </Card>

        {/* Stages */}
        <Card pad={isMobile ? 16 : 22} radius={16}>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: "-0.2px" }}>PPS Stages · 阶段性付款</div>
            <div style={{ fontSize: 12, color: "var(--fg-muted)", marginTop: 2 }}>Milestones grouped by phase · cumulative cash-flow</div>
          </div>

          <CashflowChart rows={rows} buildMonths={buildMonths} />

          <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 16 }}>
            {STAGE_GROUPS.map(group => {
              const gRows = group.indices.map(i => rows[i]);
              const totalAmt = gRows.reduce((s, r) => s + r.amount, 0);
              const totalCash = gRows.reduce((s, r) => s + r.cashDown, 0);
              const totalCpf = gRows.reduce((s, r) => s + r.cpfUsed, 0);
              const totalLoan = gRows.reduce((s, r) => s + r.loanDrawn, 0);
              const totalPct = gRows.reduce((s, r) => s + r.pct, 0);
              const fromAt = gRows[0].at;
              const toAt = gRows[gRows.length - 1].at;

              return (
                <div key={group.label} style={{ borderRadius: 10, overflow: "hidden", border: `1px solid var(--border-muted)` }}>
                  {/* Group header */}
                  <div style={{ padding: "10px 12px", background: group.bg, display: "flex", alignItems: "center", gap: 10, borderBottom: "1px solid var(--border-muted)" }}>
                    <div style={{ width: 8, height: 8, borderRadius: 9999, background: group.color, flexShrink: 0 }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <span style={{ fontSize: 12, fontWeight: 700, color: "var(--fg-default)" }}>{group.label}</span>
                      <span style={{ fontSize: 11, color: "var(--fg-muted)", marginLeft: 6 }}>· {group.zh}</span>
                    </div>
                    <div style={{ fontSize: 11, color: "var(--fg-muted)", fontFamily: "var(--font-mono)", flexShrink: 0 }}>
                      {fromAt === 0 ? "T0" : `+${fromAt}m`}{fromAt !== toAt ? `–+${toAt}m` : ""}
                    </div>
                    <div style={{ fontSize: 13, fontWeight: 700, fontFamily: "var(--font-mono)", color: group.color, flexShrink: 0, marginLeft: 8 }}>
                      ${Math.round(totalAmt/1000)}k <span style={{ fontSize: 10, fontWeight: 500, color: "var(--fg-muted)" }}>({totalPct}%)</span>
                    </div>
                  </div>
                  {/* Group summary row */}
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 0, padding: "8px 12px 8px", background: "var(--bg-default)", borderBottom: "1px solid var(--border-muted)" }}>
                    <div>
                      <div style={{ fontSize: 9, fontWeight: 700, color: "var(--fg-muted)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Cash</div>
                      <div style={{ fontSize: 12, fontWeight: 600, fontFamily: "var(--font-mono)" }}>${Math.round(totalCash/1000)}k</div>
                    </div>
                    <div>
                      <div style={{ fontSize: 9, fontWeight: 700, color: "var(--fg-muted)", textTransform: "uppercase", letterSpacing: "0.06em" }}>CPF</div>
                      <div style={{ fontSize: 12, fontWeight: 600, fontFamily: "var(--font-mono)", color: totalCpf > 0 ? "#2B873F" : "var(--fg-muted)" }}>
                        {totalCpf > 0 ? `$${Math.round(totalCpf/1000)}k` : "—"}
                      </div>
                    </div>
                    <div>
                      <div style={{ fontSize: 9, fontWeight: 700, color: "var(--fg-muted)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Bank loan</div>
                      <div style={{ fontSize: 12, fontFamily: "var(--font-mono)", color: "var(--fg-muted)" }}>${Math.round(totalLoan/1000)}k</div>
                    </div>
                  </div>
                  {/* Individual milestones */}
                  {gRows.map((r, j) => (
                    <div key={j} style={{
                      display: "flex", alignItems: "center", gap: 10,
                      padding: "8px 12px", background: "var(--bg-default)",
                      borderTop: j > 0 ? "1px solid var(--border-muted)" : "none",
                    }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <span style={{ fontSize: 12, fontWeight: 500, color: "var(--fg-default)" }}>{r.name}</span>
                        <span style={{ fontSize: 11, color: "var(--fg-muted)", marginLeft: 6 }}>· {r.zh}</span>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
                        <span style={{ fontSize: 11, color: "var(--fg-muted)", fontFamily: "var(--font-mono)" }}>{r.at === 0 ? "T0" : `+${r.at}m`}</span>
                        <span style={{ fontSize: 12, fontWeight: 700, fontFamily: "var(--font-mono)", minWidth: 56, textAlign: "right" }}>${Math.round(r.amount/1000)}k</span>
                        {r.interestOnly > 0 && (
                          <span style={{ fontSize: 11, color: "#C85D00", fontFamily: "var(--font-mono)" }}>+${Math.round(r.interestOnly)}/mo</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </Card>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: "var(--fg-default)", marginBottom: 6 }}>{label}</div>
      {children}
    </div>
  );
}

function CashflowChart({ rows, buildMonths }) {
  const W = 680, H = 140, padL = 40, padR = 12, padT = 10, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB;
  const maxT = buildMonths + 14;
  const x = t => padL + (t / maxT) * iw;
  const maxCum = Math.max(...rows.map(r => r.cumLoan)) || 1;
  const y = v => padT + ih - (v / maxCum) * ih;

  const line = rows.map((r, i) => `${i === 0 ? "M" : "L"}${x(r.at).toFixed(1)},${y(r.cumLoan).toFixed(1)}`).join(" ");
  const area = `${line} L${x(rows[rows.length-1].at)},${y(0)} L${x(0)},${y(0)} Z`;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
      {[0, 0.5, 1].map((f, i) => (
        <g key={i}>
          <line x1={padL} x2={W-padR} y1={y(maxCum*f)} y2={y(maxCum*f)} stroke="var(--gray-20)" strokeDasharray={i===0?"0":"2 3"} />
          <text x={padL-6} y={y(maxCum*f)+3} textAnchor="end" fontSize="9" fill="var(--fg-muted)" fontFamily="var(--font-mono)">
            ${Math.round(maxCum*f/1000)}k
          </text>
        </g>
      ))}
      <line x1={x(buildMonths)} x2={x(buildMonths)} y1={padT} y2={padT+ih} stroke="#2B873F" strokeDasharray="2 3" />
      <text x={x(buildMonths)} y={H-6} textAnchor="middle" fontSize="9" fill="#2B873F" fontWeight="700">TOP</text>
      <path d={area} fill="rgba(55,101,246,0.14)" />
      <path d={line} fill="none" stroke="#3765F6" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {rows.map((r, i) => (
        <circle key={i} cx={x(r.at)} cy={y(r.cumLoan)} r="3" fill="#fff" stroke="#3765F6" strokeWidth="2" />
      ))}
    </svg>
  );
}

window.Calculator = Calculator;

</script>

<script type="text/babel">
/* global React, Card, Stub, Icon */

function GenericScreen({ title, zhTitle, lang, description }) {
  return (
    <div style={{ padding: 24 }}>
      <Card pad={32} radius={16} style={{ textAlign: "center", background: "var(--gray-10)" }}>
        <div style={{ display: "inline-flex", width: 56, height: 56, borderRadius: 14, background: "var(--bg-default)", border: "1px solid var(--border-muted)", alignItems: "center", justifyContent: "center", marginBottom: 12 }}>
          <Icon name="construction" size={22} color="var(--fg-muted)" />
        </div>
        <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: "-0.3px" }}>
          {title} {lang === "both" && <span style={{ color: "var(--fg-muted)", fontWeight: 500 }}>· {zhTitle}</span>}
        </div>
        <div style={{ fontSize: 13, color: "var(--fg-muted)", marginTop: 6, maxWidth: 480, margin: "6px auto 0" }}>
          {description}
        </div>
      </Card>
    </div>
  );
}

window.GenericScreen = GenericScreen;

</script>

<script type="text/babel">
/* global React, ReactDOM, Sidebar, Topbar, Dashboard, ProjectsList, ProjectDetail, Calculator, GenericScreen */
const { useState, useEffect } = React;
const useMobile = () => {
  const [m, setM] = useState(() => window.innerWidth < 768);
  useEffect(() => {
    const h = () => setM(window.innerWidth < 768);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return m;
};

// Tweakable defaults (persona + lang default) — persisted by host
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "persona": "investor",
  "lang": "both"
}/*EDITMODE-END*/;

function App() {
  const [route, setRoute] = useState(() => localStorage.getItem("nlf-route") || "dashboard");
  const [projectId, setProjectId] = useState(() => localStorage.getItem("nlf-project") || null);
  const [persona, setPersona] = useState(TWEAK_DEFAULTS.persona);
  const [lang, setLang] = useState(TWEAK_DEFAULTS.lang);
  const [tweakOpen, setTweakOpen] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const isMobile = useMobile();

  // Edit-mode wiring
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") setTweakOpen(true);
      if (d.type === "__deactivate_edit_mode") setTweakOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  useEffect(() => { localStorage.setItem("nlf-route", route); }, [route]);
  useEffect(() => { if (projectId) localStorage.setItem("nlf-project", projectId); }, [projectId]);
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const openProject = (id) => { setProjectId(id); setRoute("project"); if (isMobile) setSidebarOpen(false); };
  const navTo = (r) => { setRoute(r); if (isMobile) setSidebarOpen(false); };
  const setPersonaPersist = (p) => {
    setPersona(p);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { persona: p } }, "*");
  };
  const setLangPersist = (l) => {
    setLang(l);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { lang: l } }, "*");
  };

  const titles = {
    dashboard: { en: "Dashboard", zh: "总览", sub: "Your daily briefing of Singapore new-launch forecasts.", zhSub: "新加坡新盘预测每日简报" },
    launched: { en: "Launched Projects", zh: "已开盘", sub: "Live launches · TOP forecasts & attribution.", zhSub: "已开售项目 · TOP预测" },
    upcoming: { en: "Upcoming Launches", zh: "待开盘", sub: "Preview-stage projects · fair PSF & entry score.", zhSub: "预览阶段 · 合理尺价" },
    calculator: { en: "PPS Calculator", zh: "付款计算器", sub: "Model cashflow from booking to CSC.", zhSub: "期房阶段性付款模拟" },
    watchlist: { en: "Watchlist", zh: "关注列表", sub: "Tracked projects", zhSub: "" },
    developers: { en: "Developer Track Record", zh: "开发商战绩", sub: "Historical performance & quality signals.", zhSub: "" },
    masterplan: { en: "URA Master Plan", zh: "发展蓝图", sub: "Long-term regional catalysts.", zhSub: "" },
    settings: { en: "Settings", zh: "设置", sub: "Account, preferences, data sources.", zhSub: "" },
    project: { en: "Project Detail", zh: "项目详情", sub: "", zhSub: "" },
  };
  const t = titles[route] || titles.dashboard;

  let screen;
  switch (route) {
    case "dashboard": screen = <Dashboard lang={lang} persona={persona} onNav={setRoute} onOpenProject={openProject} />; break;
    case "launched": screen = <ProjectsList lang={lang} mode="launched" onOpenProject={openProject} />; break;
    case "upcoming": screen = <ProjectsList lang={lang} mode="upcoming" onOpenProject={openProject} />; break;
    case "calculator": screen = <Calculator lang={lang} />; break;
    case "project": screen = <ProjectDetail projectId={projectId} lang={lang} persona={persona} onBack={() => setRoute("launched")} />; break;
    case "watchlist": screen = <GenericScreen title="Watchlist" zhTitle="关注列表" lang={lang} description="Drag any project from Launched or Upcoming into your watchlist to track its forecast drift and caveat activity here." />; break;
    case "developers": screen = <GenericScreen title="Developer Track Record" zhTitle="开发商战绩" lang={lang} description="Aggregated quality scores, historical TOP-uplift, and defect rates across all tracked developers." />; break;
    case "masterplan": screen = <GenericScreen title="URA Master Plan 2025/2030" zhTitle="发展蓝图" lang={lang} description="Cross-Island Line, Jurong Lake District, Greater Southern Waterfront — regional catalysts scored and mapped to launches." />; break;
    case "settings": screen = <GenericScreen title="Settings" zhTitle="设置" lang={lang} description="Account, workspace, data sources, and notification preferences." />; break;
    default: screen = <Dashboard lang={lang} persona={persona} onNav={setRoute} onOpenProject={openProject} />;
  }

  return (
    <div style={{ display: "flex", minHeight: "100vh", background: "var(--bg-muted)" }}>
      {isMobile && sidebarOpen && (
        <div onClick={() => setSidebarOpen(false)} style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 150,
        }} />
      )}
      <Sidebar
        active={route === "project" ? "launched" : route}
        onNav={navTo} lang={lang}
        mobile={isMobile} open={sidebarOpen}
        onClose={() => setSidebarOpen(false)}
      />
      <main style={{ flex: 1, minWidth: 0 }}>
        <Topbar
          title={t.en} zhTitle={t.zh}
          subtitle={t.sub} zhSubtitle={t.zhSub}
          lang={lang} persona={persona}
          onPersonaChange={setPersonaPersist}
          onLangChange={setLangPersist}
          isMobile={isMobile}
          onMenuToggle={() => setSidebarOpen(o => !o)}
        />
        {React.cloneElement(screen, { isMobile })}
      </main>

      {tweakOpen && (
        <TweaksPanel
          persona={persona} onPersonaChange={setPersonaPersist}
          lang={lang} onLangChange={setLangPersist}
          onClose={() => setTweakOpen(false)}
        />
      )}
    </div>
  );
}

function TweaksPanel({ persona, onPersonaChange, lang, onLangChange, onClose }) {
  const personas = [
    { id: "investor", label: "Investor · 投资者" },
    { id: "upgrader", label: "HDB Upgrader · 组屋升级" },
    { id: "firsttime", label: "First-time Buyer · 首套" },
  ];
  return (
    <div style={{
      position: "fixed", right: 20, bottom: 20, width: 280,
      background: "var(--bg-default)", border: "1px solid var(--border-default)",
      borderRadius: 14, boxShadow: "var(--shadow-lg)", padding: 16, zIndex: 100,
      fontFamily: "var(--font-sans)",
    }}>
      <div style={{ display: "flex", alignItems: "center", marginBottom: 12 }}>
        <div style={{ flex: 1, fontSize: 13, fontWeight: 700, letterSpacing: "-0.2px" }}>Tweaks</div>
        <button onClick={onClose} style={{ border: 0, background: "transparent", cursor: "pointer", color: "var(--fg-muted)" }}>
          <i data-lucide="x" style={{ width: 16, height: 16 }} />
        </button>
      </div>
      <div style={{ fontSize: 11, fontWeight: 600, color: "var(--fg-muted)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>Persona · 视角</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 14 }}>
        {personas.map(p => (
          <button key={p.id} onClick={() => onPersonaChange(p.id)} style={{
            padding: "8px 10px", border: "1px solid var(--border-muted)", borderRadius: 8,
            background: persona === p.id ? "var(--gray-100)" : "var(--bg-default)",
            color: persona === p.id ? "#fff" : "var(--fg-default)",
            fontSize: 12, fontWeight: 600, textAlign: "left", cursor: "pointer",
          }}>{p.label}</button>
        ))}
      </div>
      <div style={{ fontSize: 11, fontWeight: 600, color: "var(--fg-muted)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>Language · 语言</div>
      <div style={{ display: "flex", gap: 6 }}>
        {[{id:"en",l:"English"},{id:"both",l:"EN · 中"}].map(o => (
          <button key={o.id} onClick={() => onLangChange(o.id)} style={{
            flex: 1, padding: "8px", border: "1px solid var(--border-muted)", borderRadius: 8,
            background: lang === o.id ? "var(--gray-100)" : "var(--bg-default)",
            color: lang === o.id ? "#fff" : "var(--fg-default)",
            fontSize: 12, fontWeight: 600, cursor: "pointer",
          }}>{o.l}</button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
